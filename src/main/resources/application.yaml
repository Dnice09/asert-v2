logging:
  level:
    ROOT: INFO
    tech.jhipster: ERROR
    org.hibernate.SQL: INFO
    tz.go.mnrt.asert: ERROR
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p){blue} %clr(%logger{36}){cyan} - %clr(%msg){yellow}%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  color:
    highlight:
      fatal: red
      error: red
      warn: yellow
      info: green
      debug: blue
      trace: magenta
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.hotmail.com
    port: 587
    username: email@my-domain.com
    password: my-secret-password
    properties:
      mail:
        setTls: true
        smtp:
          auth: true
          starttls:
            enable: true
  main:
    allow-circular-references: true
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      strategy: reload
      additional-exclude: static/**
  jackson:
    serialization:
      indent-output: true
  flyway:
    sql-migration-prefix:
    table: migrations
    validate-on-migrate: false
    out-of-order: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost/asert
    username: 'postgres'
    password: 'Db@2024'
    hikari:
      poolName: Hikari
      auto-commit: false
  jasper-reports:
    output-directory: /app/asert-jasper-reports/
    compiled-templates-directory: /app/asert-jasper-reports/
  security:
    token-signing-key: "1233"
    token-validity-time: 360 #Seconds
  rabbitmq:
    queue:
      apikey-published-queue: APIKEY_PUBLISHED
      apikey-failed-queue: APIKEY_FAILED
asert:
  uploaded-files:
    url: /app/asert-file-uploads
  default-password: 'Asert2@25'
  jasper-reports:
    template-directory: /app/asert-jasper-reports/
    compiled-directory: /app/asert-jasper-reports/
  security:
    token-signing-key: "1233"
    token-validity-time: 3600 #Seconds
    refresh-token-validity-time: 36000
environment: "dev"

server:
  servlet:
    timeout: 120000 # 2 minutes
email:
  sender-email: youremail@gmail.com
#removed this from .gitignore to be able to use it in development, but make sure to remove it before pushing to production